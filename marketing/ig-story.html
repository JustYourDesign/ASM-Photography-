<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASM Photography — Instagram Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0b0b; position: relative; }
  body { font-family: 'Montserrat', sans-serif; }
  .photo {
    position: absolute; inset: 0;
    background-image: url('/images/hero/hero-main.jpg');
    background-size: cover; background-position: 62% 22%;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(11,11,11,0.97) 0%, rgba(11,11,11,0.6) 34%, rgba(11,11,11,0.05) 55%, rgba(11,11,11,0.3) 100%);
  }
  .wordmark {
    position: absolute; top: 5.7vh; left: 0; right: 0;
    text-align: center; color: #f7f5f2;
    font-size: 2.2vw; font-weight: 600; letter-spacing: 0.35em;
  }
  .content {
    position: absolute; left: 0; right: 0; bottom: 11.5vh;
    text-align: center; padding: 0 7.4vw;
  }
  .eyebrow {
    color: #c9b79c; font-size: 1.75vw; font-weight: 600;
    letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 2.4vh;
  }
  .headline {
    color: #f7f5f2; font-size: 6.65vw; font-weight: 700;
    line-height: 1.04; margin-bottom: 1vh;
  }
  .script {
    font-family: 'Parisienne', cursive; color: #c9b79c;
    font-size: 5vw; font-weight: 400; margin-bottom: 5vh;
  }
  .swipe {
    position: absolute; bottom: 4.7vh; left: 0; right: 0;
    text-align: center; color: #f7f5f2cc;
    font-size: 1.5vw; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase;
  }
  .chev {
    display: block; margin: 1.4vh auto 0; width: 2vw; height: 2vw;
    border-right: 2px solid #f7f5f2cc; border-bottom: 2px solid #f7f5f2cc;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="wordmark">ASM PHOTOGRAPHY</div>
  <div class="content">
    <div class="eyebrow">Our New Website Is Live</div>
    <div class="headline">Capturing Stories</div>
    <div class="script">that last forever</div>
  </div>
  <div class="swipe">Swipe Up<span class="chev"></span></div>
</body>
</html>
