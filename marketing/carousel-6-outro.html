<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASM Photography — Carousel 6 Outro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0b0b; position: relative; }
  body { font-family: 'Montserrat', sans-serif; }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(201,183,156,0.16) 0%, transparent 55%);
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(231,221,205,0.35); pointer-events: none; }
  .wordmark {
    position: absolute; top: 72px; left: 0; right: 0; text-align: center;
    color: #f7f5f2; font-size: 22px; font-weight: 600; letter-spacing: 0.35em;
  }
  .index {
    position: absolute; top: 76px; right: 90px;
    color: rgba(247,245,242,0.55); font-size: 15px; font-weight: 500; letter-spacing: 0.15em;
  }
  .content {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; padding: 0 110px;
  }
  .eyebrow {
    color: #c9b79c; font-size: 18px; font-weight: 600;
    letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 26px;
  }
  .headline { color: #f7f5f2; font-size: 64px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 44px; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: #f7f5f2; color: #0b0b0b; font-size: 16px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase; padding: 18px 40px; border-radius: 999px;
  }
  .handle {
    position: absolute; left: 0; right: 0; bottom: 88px; text-align: center;
    color: rgba(247,245,242,0.5); font-size: 16px; font-weight: 500; letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="wordmark">ASM PHOTOGRAPHY</div>
  <div class="index">06 / 06</div>
  <div class="content">
    <div class="eyebrow">Start A Project</div>
    <div class="headline">Let&rsquo;s Create Something<br />Beautiful Together</div>
    <div class="cta">asmphotography.co.za</div>
  </div>
  <div class="handle">@asmphotography</div>
</body>
</html>
