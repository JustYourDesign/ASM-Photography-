<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASM Photography — Carousel 4 Fashion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0b0b; position: relative; }
  body { font-family: 'Montserrat', sans-serif; }
  .photo {
    position: absolute; inset: 0;
    background-image: url('/images/fashion/the-car-story/01.jpg');
    background-size: cover; background-position: center 40%;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(11,11,11,0.92) 0%, rgba(11,11,11,0.45) 42%, rgba(11,11,11,0.05) 65%, rgba(11,11,11,0.3) 100%);
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(231,221,205,0.35); pointer-events: none; }
  .wordmark {
    position: absolute; top: 72px; left: 0; right: 0; text-align: center;
    color: #f7f5f2; font-size: 22px; font-weight: 600; letter-spacing: 0.35em;
  }
  .index {
    position: absolute; top: 76px; right: 90px;
    color: rgba(247,245,242,0.55); font-size: 15px; font-weight: 500; letter-spacing: 0.15em;
  }
  .content { position: absolute; left: 0; right: 0; bottom: 96px; text-align: center; padding: 0 90px; }
  .eyebrow {
    color: #c9b79c; font-size: 18px; font-weight: 600;
    letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 22px;
  }
  .headline { color: #f7f5f2; font-size: 84px; font-weight: 700; line-height: 1.02; letter-spacing: -0.01em; margin-bottom: 22px; }
  .tagline { color: rgba(247,245,242,0.75); font-size: 24px; font-weight: 400; line-height: 1.4; max-width: 720px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="frame"></div>
  <div class="wordmark">ASM PHOTOGRAPHY</div>
  <div class="index">04 / 06</div>
  <div class="content">
    <div class="eyebrow">Portfolio</div>
    <div class="headline">Fashion</div>
    <div class="tagline">Magazine-inspired campaigns and editorial fashion.</div>
  </div>
</body>
</html>
