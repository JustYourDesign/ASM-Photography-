<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASM Photography — Instagram Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0b0b; }
  html, body { position: relative; }
  body { font-family: 'Montserrat', sans-serif; }
  .photo {
    position: absolute; inset: 0;
    background-image: url('/images/hero/hero-main.jpg');
    background-size: cover; background-position: 60% 30%;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(11,11,11,0.95) 0%, rgba(11,11,11,0.55) 38%, rgba(11,11,11,0.05) 65%, rgba(11,11,11,0.35) 100%);
  }
  .frame {
    position: absolute; inset: 40px;
    border: 1px solid rgba(231,221,205,0.35);
    pointer-events: none;
  }
  .wordmark {
    position: absolute; top: 72px; left: 0; right: 0;
    text-align: center;
    color: #f7f5f2;
    font-size: 22px; font-weight: 600; letter-spacing: 0.35em;
  }
  .content {
    position: absolute; left: 0; right: 0; bottom: 96px;
    text-align: center; padding: 0 90px;
  }
  .eyebrow {
    color: #c9b79c; font-size: 18px; font-weight: 600;
    letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 22px;
  }
  .headline {
    color: #f7f5f2; font-size: 76px; font-weight: 700;
    line-height: 1.02; letter-spacing: -0.01em; margin-bottom: 10px;
  }
  .script {
    font-family: 'Parisienne', cursive; color: #c9b79c;
    font-size: 56px; font-weight: 400; margin-bottom: 40px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(247,245,242,0.5);
    color: #f7f5f2; font-size: 16px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 16px 34px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="frame"></div>
  <div class="wordmark">ASM PHOTOGRAPHY</div>
  <div class="content">
    <div class="eyebrow">New Website — Now Live</div>
    <div class="headline">Capturing Stories</div>
    <div class="script">that last forever</div>
    <div class="cta">asmphotography.co.za</div>
  </div>
</body>
</html>
